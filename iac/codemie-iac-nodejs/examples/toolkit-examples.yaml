# ============================================
# IMPORTANT NOTES
# ============================================
#
# 1. **Integration IDs**: For Project Management tools (Jira/Confluence),
#    you need to provide the integration ID from your Codemie project settings.
#    These are created in the Codemie UI under Project Settings → Integrations.
#
# 2. **Settings Config**: When `settings_config: true`, the tool requires
#    additional configuration in the Codemie UI or via settings field.
#
# 3. **Is External**: Currently all standard toolkits have `is_external: false`.
#    External toolkits would be custom integrations.
#
# 4. **Empty Tools Array**: Some toolkits (like OpenAPI) can have an empty
#    tools array, which means the toolkit provides general capabilities
#    without specific tool configurations.
#
# 5. **Tool Settings**: The `settings` field in tools contains integration
#    credentials and configuration. For security, sensitive values (tokens)
#    are masked in responses.

# ============================================
# 5. MCP (MODEL CONTEXT PROTOCOL) SERVERS
# ============================================
# Purpose: External integrations via MCP protocol
# Common use cases: Figma, Atlassian (alternative to toolkits), custom integrations

# MCP servers provide an alternative way to integrate external services
# They run as separate processes and communicate via stdin/stdout

# Figma MCP (with Settings)
figma_mcp_with_settings:
  name: Figma
  description: "Figma MCP"
  enabled: true
  command: npx
  arguments: "-y figma-developer-mcp --stdio"
  settings:
    id: "your-mcp-integration-id"  # From Codemie Project Settings
    credential_type: MCP
    credential_values:
      - key: "FIGMA_API_KEY"
        value: "your-figma-api-key"

# Figma MCP (with Config)
figma_mcp_with_config:
  name: Figma MCP
  description: "Figma integration via MCP"
  enabled: true
  command: null  # When using config
  arguments: null  # When using config
  config:
    command: npx
    args:
      - "-y"
      - "figma-developer-mcp"
      - "--figma-api-key=your-figma-api-key"
      - "--stdio"
    env: {}
    headers: {}

# Atlassian MCP (alternative to Project Management toolkit)
atlassian_mcp:
  name: MCP for Atlassian
  description: "Connection to Jira/Confluence servers using Atlassian MCP"
  enabled: false  # Can be enabled/disabled
  command: uvx
  arguments: "mcp-atlassian --jira-url 'https://jira.example.com' --jira-username 'bot@example.com' --jira-token 'your-token' --confluence-url 'https://confluence.example.com' --confluence-username 'bot@example.com' --confluence-token 'your-token'"
  config: null
  settings: null

# Usage in codemie.yaml:
mcp_assistant_example:
  name: Design Assistant with Figma
  slug: design-assistant
  prompt: ./prompts/design-assistant.md
  description: "Assistant with Figma MCP integration"
  model: gpt-4o
  mcp_servers:
    - name: Figma
      description: "Figma MCP"
      enabled: true
      command: npx
      arguments: "-y figma-developer-mcp --stdio"
      settings:
        id: "00000000-0000-0000-0000-000000000011"
        credential_type: MCP
        credential_values:
          - key: "FIGMA_API_KEY"
            value: "**********"  # Managed in Codemie UI

# ============================================
# MCP vs TOOLKITS: WHEN TO USE WHAT?
# ============================================
#
# **Toolkits** (recommended for standard integrations):
# - Built-in Codemie integrations
# - Managed through Codemie UI
# - Examples: Git, Project Management (Jira/Confluence), OpenAPI, FileSystem
#
# **MCP Servers** (for advanced/custom integrations):
# - External processes that implement MCP protocol
# - More flexible, can be custom-built
# - Examples: Figma, custom tools, external APIs
# - Can be enabled/disabled at runtime
#
# **Atlassian MCP vs Project Management Toolkit**:
# - Project Management toolkit uses Codemie's built-in integration
# - Atlassian MCP uses external MCP server (more features, but external dependency)
# - For most cases, use the toolkit; use MCP for advanced Atlassian features

# ============================================
# MCP SERVER STRUCTURE
# ============================================
#
# Fields:
# - name: Display name of the MCP server
# - description: Optional description
# - enabled: true/false - can be toggled
# - command: Executable command (e.g., npx, uvx, python)
# - arguments: Command-line arguments as a string
# - config: Alternative to command+arguments (more structured)
# - settings: Integration settings from Codemie UI (credentials, etc.)
# - mcp_connect_url: URL for MCP Connect-based servers (rare)

# ============================================
# HOW TO FIND YOUR INTEGRATION IDS
# ============================================
#
# To get your Jira/Confluence integration IDs:
# 1. Go to Codemie UI
# 2. Navigate to Project Settings → Integrations
# 3. Find your Jira/Confluence integration
# 4. Copy the integration ID (UUID format)
#
# Or use the API:
# curl -H "Authorization: Bearer <your-access-token>" \
#   https://your-codemie-api/projects/YOUR_PROJECT/integrations

