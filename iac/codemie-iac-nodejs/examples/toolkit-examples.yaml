  toolkit: Project Management
  label: 
  settings_config: false
  is_external: false
  tools:
    - name: generic_confluence_tool
      label: Generic Confluence
      settings_config: false
      settings:
        id: "00000000-0000-0000-0000-000000000005"  # Confluence integration ID (REQUIRED)
        alias: "Confluence Server Read+Write Connection"  # Human-readable name
        credential_type: Confluence  # REQUIRED
        default: false  # Whether this is the default integration
        setting_type: project  # project/user/global
        is_global: false  # Whether integration is available globally

# Both Jira and Confluence
project_management_full:
  toolkit: Project Management
  label: 
  settings_config: false
  is_external: false
  tools:
    - name: generic_jira_tool
      label: Generic Jira
      settings_config: false
      settings:
        id: "00000000-0000-0000-0000-000000000001"  # Integration ID (from Codemie)
        date: "2025-07-14T12:40:21.447127"  # Created date (auto-generated)
        update_date: "2025-08-26T13:27:13.873590"  # Last update (auto-generated)
        user_id: "00000000-0000-0000-0000-000000000010"  # Creator user ID
        project_name: my-project  # Project name
        alias: "Jira Server Read+Write Connection"  # Human-readable name
        default: false  # Not the default integration
        credential_type: Jira  # Integration type (REQUIRED)
        credential_values:  # Integration credentials
          - key: "url"
            value: "https://jira.example.com"
          - key: "username"
            value: ""
          - key: "token"
            value: "**********"
        setting_hash: null  # Internal hash (auto-generated)
        setting_type: project  # Scope: project/user/global
        is_global: false  # Not globally available
    
    - name: generic_confluence_tool
      label: Generic Confluence
      settings_config: false
      settings:
        id: "00000000-0000-0000-0000-000000000005"  # Integration ID (from Codemie)
        date: "2025-07-14T12:44:26.902529"  # Created date (auto-generated)
        update_date: "2025-08-26T13:27:33.111755"  # Last update (auto-generated)
        user_id: "00000000-0000-0000-0000-000000000010"  # Creator user ID
        project_name: my-project  # Project name
        alias: "Confluence Server Read+Write Connection"  # Human-readable name
        default: false  # Not the default integration
        credential_type: Confluence  # Integration type (REQUIRED)
        credential_values:  # Integration credentials
          - key: "url"
            value: "https://confluence.example.com"
          - key: "token"
            value: "**********"
        setting_hash: null  # Internal hash (auto-generated)
        setting_type: project  # Scope: project/user/global
        is_global: false  # Not globally available

