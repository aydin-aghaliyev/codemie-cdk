# ============================================
# TOOLKIT CONFIGURATION EXAMPLES
# ============================================
#
# This file contains detailed examples for configuring toolkits in Codemie assistants.
# Toolkits provide additional capabilities to assistants, such as Git operations,
# Project Management (Jira/Confluence), OpenAPI integration, and file system access.
#
# Based on codemie-sdk v1.x and real-world assistant examples

# ============================================
# TOOLKIT STRUCTURE IN CODEMIE.YAML
# ============================================
#
# Toolkits are defined as an array in the assistant configuration:
#
# resources:
#   assistants:
#     - name: my-assistant
#       # ... other fields ...
#       toolkits:
#         - toolkit: Git
#           label: 
#           settings_config: true
#           is_external: false
#           tools:
#             - name: get_pr_changes
#               label: Get PR Changes
#               settings_config: false

# ============================================
# AVAILABLE TOOLKITS
# ============================================
#
# 1. Git             - Git operations (PR changes, diffs)
# 2. Project Management - Jira and Confluence integration
# 3. OpenAPI         - OpenAPI specification tools
# 4. FileSystem      - Code interpreter and file operations

# ============================================
# 1. GIT TOOLKIT
# ============================================
# Purpose: Access Git repository information, PR changes, and diffs
# Common use cases: Code reviews, analyzing changes, understanding PRs

git_toolkit_minimal:
  toolkit: Git
  label: 
  settings_config: true
  is_external: false
  tools:
    - name: get_pr_changes
      label: Get PR Changes
      settings_config: false

# Full example with all fields
git_toolkit_full:
  toolkit: Git
  label:   # Optional label for the toolkit
  settings_config: true  # Requires Git integration settings
  is_external: false  # Internal Codemie toolkit
  tools:
    - name: get_pr_changes
      label: Get PR Changes
      settings_config: false  # No per-tool settings needed
      user_description: ""  # Optional description

# Usage in codemie.yaml:
git_assistant_example:
  name: Code Review Assistant
  slug: code-review-assistant
  prompt: ./prompts/code-review.md
  description: "Assistant for reviewing PRs"
  model: gpt-4o
  toolkits:
    - toolkit: Git
      label: 
      settings_config: true
      is_external: false
      tools:
        - name: get_pr_changes
          label: Get PR Changes
          settings_config: false

# ============================================
# 2. PROJECT MANAGEMENT TOOLKIT
# ============================================
# Purpose: Integration with Jira and Confluence
# Common use cases: BA work, documentation, issue tracking
#
# IMPORTANT: Integration Settings Structure
# - id: UUID from Codemie Project Settings → Integrations (REQUIRED)
# - credential_type: Jira or "Confluence" (REQUIRED)
# - alias: Human-readable name (OPTIONAL but recommended)
# - default: Whether this is the default integration (OPTIONAL, default: false)
# - setting_type: project (project-level) / "user" (user-level) / "global" (OPTIONAL, default: "project")
# - is_global: Whether integration is globally available (OPTIONAL, default: false)
# - date, update_date, user_id, project_name: Auto-generated by platform
# - credential_values: Credentials like URL, token (managed in Codemie UI)
# - setting_hash: Internal hash (auto-generated)
#
# ============================================
# INTEGRATION ALIASES & TOOL DEFINITIONS (RECOMMENDED)
# ============================================
# Two-level system for maximum reusability and clean config

# Step 1: Define integrations in codemie.yaml (created in Codemie UI)
imported:
  integrations:
    jira_main:
      id: "00000000-0000-0000-0000-000000000001"
      type: Jira
      alias: "Jira Server Read+Write Connection"
    
    confluence_main:
      id: "00000000-0000-0000-0000-000000000005"
      type: Confluence
      alias: "Confluence Server Read+Write Connection"

# Step 2: Define tools (referencing integrations)
tool_definitions_example:
  jira_tool:
    name: generic_jira_tool
    label: Generic Jira
    settings_config: false
    settings:
      $ref: imported.integrations.jira_main  # References integration by path
  
  confluence_tool:
    name: generic_confluence_tool
    label: Generic Confluence
    settings_config: false
    settings:
      $ref: imported.integrations.confluence_main  # References integration by path

# Step 3: Use tool definitions in toolkits (CLEANEST APPROACH)
pm_toolkit_with_tool_definitions:
  toolkit: Project Management
  label: 
  settings_config: false
  is_external: false
  tools:
    - $ref: tool_definitions.jira_tool      # ✅ Explicit path to tool definition!
    - $ref: tool_definitions.confluence_tool  # ✅ Clear where it's defined!

# Alternative: Reference integrations directly (middle ground)
pm_toolkit_with_integration_references:
  toolkit: Project Management
  label: 
  settings_config: false
  is_external: false
  tools:
    - name: generic_jira_tool
      label: Generic Jira
      settings_config: false
      settings:
        $ref: imported.integrations.jira_main  # ✅ Full path to integration
    - name: generic_confluence_tool
      label: Generic Confluence
      settings_config: false
      settings:
        $ref: imported.integrations.confluence_main  # ✅ Full path to integration

# Benefits:
# ✅ Define once, use everywhere
# ✅ Ultra clean config (1 line per tool vs 10+ lines)
# ✅ Easy to update integration/tool in one place
# ✅ Explicit paths: immediately clear where referenced object is defined
# ✅ Reusable across multiple assistants
# ✅ Better error messages with full path information

# ============================================
# MANUAL APPROACH (WITHOUT ALIASES)
# ============================================

# Jira Tool Only (Minimal)
jira_toolkit_minimal:
  toolkit: Project Management
  label: 
  settings_config: false
  is_external: false
  tools:
    - name: generic_jira_tool
      label: Generic Jira
      settings_config: false
      settings:
        id: "00000000-0000-0000-0000-000000000001"  # Jira integration ID (REQUIRED)
        alias: "Jira Server Read+Write Connection"  # Human-readable name
        credential_type: Jira  # REQUIRED
        default: false  # Whether this is the default integration
        setting_type: project  # project/user/global
        is_global: false  # Whether integration is available globally

# Confluence Tool Only (Minimal)
